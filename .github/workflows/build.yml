name: build

# patches a decrypted discord ipa for ios 15 and uploads the result as an
# artifact. what ios 15 exports comes from the shipped ios15-exports.txt.xz,
# so no shared cache is downloaded. the ipa only ever exists in the runner.
#
# the ipa link can be an input or, to keep it off the run page, the
# repository secret IPA_URL.

on:
  workflow_dispatch:
    inputs:
      ver:
        description: discord major version (names out/ and syms/)
        default: "350"
        required: true
      ipa_url:
        description: direct link to a decrypted discord ipa (empty = IPA_URL secret)
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VER: ${{ inputs.ver }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install capstone
        run: pip install capstone

      - name: fetch the ipa
        env:
          IN_IPA: ${{ inputs.ipa_url }}
          SEC_IPA: ${{ secrets.IPA_URL }}
        run: |
          url=${IN_IPA:-$SEC_IPA}
          [ -n "$url" ] || { echo "::error::no ipa: set ipa_url or the IPA_URL secret"; exit 1; }
          echo "::add-mask::$url"
          curl -fsSL "$url" -o discord.ipa
          ls -la discord.ipa

      - name: patch and verify
        run: IPA="$PWD/discord.ipa" sh ./run.sh

      - uses: actions/upload-artifact@v4
        with:
          name: discord-${{ inputs.ver }}-ios15
          path: out/${{ inputs.ver }}/Discord${{ inputs.ver }}-ios15.ipa
          if-no-files-found: error
          retention-days: 7
